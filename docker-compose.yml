# Local dev only. `docker compose up -d` then `pnpm db:migrate`.
# Requires Docker Desktop for Windows.
services:
  postgres:
    image: postgres:16-alpine
    container_name: la_postgres
    environment:
      POSTGRES_USER: launch_auditor
      POSTGRES_PASSWORD: launch_auditor
      POSTGRES_DB: launch_auditor
    ports:
      - "5432:5432"
    volumes:
      - la_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch_auditor -d launch_auditor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: la_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - la_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  la_pg:
  la_redis:
